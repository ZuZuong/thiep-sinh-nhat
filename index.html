<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Thiệp Sinh Nhật 🎀</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --pink-hot:   #FF6EB4;
    --pink-peach: #FF8FAB;
    --pink-soft:  #FFB3D9;
    --pink-light: #FFD6E7;
    --yellow:     #FFD93D;
    --dark:       #2D2D2D;
    --white:      #ffffff;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: var(--pink-light);
    font-family: 'Nunito', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── BOOK WRAPPER ── */
  #book {
    width: 100%; height: 100%;
    position: relative;
    perspective: 1200px;
  }

  /* ── PAGE BASE ── */
  .page {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  /* ══════════════════════════════
     PAGE 1 (Từ Text Block)
  ══════════════════════════════ */
  #page1 {
    background: linear-gradient(160deg, #fff0f7 0%, var(--pink-light) 50%, #ffd6e7 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    z-index: 2;
  }

  /* confetti canvas behind everything */
  #confetti-canvas {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .card-content {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    padding: 0 24px;
    gap: 18px;
  }

  /* Cake SVG */
  #cake-wrap {
    opacity: 0;
    transform: scale(0.7);
    animation: cakeIn 0.9s cubic-bezier(.34,1.56,.64,1) 0.2s forwards;
  }
  @keyframes cakeIn {
    to { opacity: 1; transform: scale(1); }
  }

  /* Candle flame flicker */
  .flame {
    transform-origin: center bottom;
    transform-box: fill-box; /* 👈 THÊM DÒNG NÀY LÀ HẾT BỊ BAY LÊN TRỜI */
    animation: flicker 1.4s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 5px rgba(255, 217, 61, 0.9)) 
            drop-shadow(0 0 10px rgba(255, 143, 171, 0.6))
            drop-shadow(0 0 15px rgba(255, 217, 61, 0.4));
}
.flame2 { animation-duration: 1.1s; animation-delay: 0.3s; }
.flame3 { animation-duration: 1.6s; animation-delay: 0.6s; }

/* 2. Sửa lại keyframe: Bỏ rotate, chỉ dùng skewX và scale */
@keyframes flicker {
    0%   { transform: scaleX(1)    scaleY(1)    skewX(0deg);  opacity: 1; }
    25%  { transform: scaleX(0.95) scaleY(1.1)  skewX(4deg);  opacity: 0.9; }
    50%  { transform: scaleX(1.05) scaleY(0.95) skewX(-4deg); opacity: 1; }
    75%  { transform: scaleX(0.9)  scaleY(1.15) skewX(3deg);  opacity: 0.85; }
    100% { transform: scaleX(1)    scaleY(1.05) skewX(-3deg); opacity: 1; }
}

  /* Title */
  .hb-title {
    font-family: 'Pacifico', cursive;
    font-size: clamp(36px, 10vw, 52px);
    color: var(--pink-hot);
    text-shadow: 3px 3px 0 #fff, 5px 5px 0 var(--pink-soft);
    text-align: center;
    line-height: 1.1;
    opacity: 0;
    transform: translateY(28px);
    animation: slideUp 0.8s ease-out 0.8s forwards;
  }
  /* Thay thế toàn bộ class .hb-name cũ bằng đoạn này */
  .hb-name {
    font-family: 'Pacifico', cursive; /* Đổi sang font uốn lượn cute */
    font-size: clamp(20px, 6vw, 32px); 
    white-space: nowrap;
    
    /* Tạo hiệu ứng chữ Gradient ánh kim (Hồng - Vàng - Hồng) */
    background: linear-gradient(90deg, #FF6EB4, black, #FF6EB4);
    background-size: 200% auto;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    
    /* Đổ bóng glow nhẹ nhàng tỏa ra xung quanh */
    filter: drop-shadow(0 2px 8px rgba(255, 110, 180, 0.5));
    
    opacity: 0;
    transform: translateY(20px);
    
    /* Kết hợp 2 hiệu ứng: Trồi lên (slideUp) và Lấp lánh lướt qua (shineText) */
    animation: slideUp 0.7s ease-out 1.1s forwards, shineText 3s linear 1.8s infinite;
  }

  /* Thêm keyframe này ngay bên dưới .hb-name để làm chữ lấp lánh */
  @keyframes shineText {
    to {
      background-position: 200% center;
    }
  }

  @keyframes slideUp {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Button */
  .btn-open {
    margin-top: 8px;
    padding: 16px 40px;
    background: linear-gradient(135deg, var(--pink-hot), var(--pink-peach));
    color: #fff;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 700;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(255,110,180,0.45);
    opacity: 0;
    transform: translateY(16px);
    animation: slideUp 0.7s ease-out 1.4s forwards, pulse 2.5s ease-in-out 2.2s infinite;
    transition: transform 0.15s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-open:active {
    transform: scale(0.95) !important;
    box-shadow: 0 4px 12px rgba(255,110,180,0.3);
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 8px 24px rgba(255,110,180,0.45); }
    50%      { box-shadow: 0 8px 36px rgba(255,110,180,0.7); }
  }

  /* corner curl hint */
  #page1::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 42px; height: 42px;
    background: linear-gradient(225deg, var(--pink-soft) 45%, transparent 46%);
    border-top-left-radius: 6px;
    pointer-events: none;
    opacity: 0.7;
  }

  /* ══════════════════════════════
     PAGE FLIP OVERLAY (Từ Text Block)
  ══════════════════════════════ */
  #flip-layer {
    position: fixed;
    inset: 0;
    z-index: 100;
    pointer-events: none;
    perspective: 1200px;
  }
  #flip-card {
    position: absolute;
    inset: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    background: linear-gradient(160deg, #fff0f7 0%, var(--pink-light) 100%);
    display: none;
  }
  #flip-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 1px, transparent 4px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 8px);
    pointer-events: none;
  }
  /* paper back side */
  #flip-card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(160deg, #f5e8d0 0%, #eddfc8 100%);
    backface-visibility: hidden;
    transform: rotateY(180deg);
  }

  /* ══════════════════════════════
     PAGE 2 (Lấy đúng từ File tải lên)
  ══════════════════════════════ */
  #page2 {
    background: linear-gradient(to bottom, #C77DFF 0%, #FF8FAB 40%, #FFD6E7 70%);
    z-index: 1;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #page2.visible {
    opacity: 1;
  }
  #page2::before {
    content: '';
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  /* Mặt trời */
  .sun {
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, #FFFFFF 0%, #FFD93D 40%, #FF6EB4 100%);
    border-radius: 50%;
    box-shadow: 0 0 40px #FFD93D, 0 0 80px #FF6EB4;
    position: absolute;
    bottom: 20%;
    left: 50%;
    margin-left: -50px;
    transform: translateY(200px); 
    transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1) 0.5s; 
    z-index: 1;
  }
  #page2.visible .sun {
    transform: translateY(-80px);
  }

  /* Mây */
  .clouds {
    position: absolute;
    top: 10%;
    width: 100%;
    height: 150px;
    z-index: 2;
  }
  .cloud {
    position: absolute;
    opacity: 0.8;
  }
  .cloud-1 { top: 10px; left: -100px; animation: floatCloud 40s linear infinite; }
  .cloud-2 { top: 60px; left: -150px; animation: floatCloud 50s linear infinite 15s; opacity: 0.6; transform: scale(0.8); }
  .cloud-3 { top: 30px; left: -120px; animation: floatCloud 30s linear infinite 5s; transform: scale(1.2); }

  /* Lời chúc */
  .wish-container {
    position: absolute;
    top: 15%; /* Đẩy lên cao hơn một chút để đủ chỗ cho text dài */
    width: 100%;
    text-align: center;
    padding: 0 24px;
    z-index: 10;
  }
  
  .wish-title {
    font-family: 'Pacifico', cursive;
    font-size: 34px;
    color: #FFFFFF;
    text-shadow: 0 0 15px #FF6EB4, 0 0 30px #FF6EB4;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 1s ease-out 1.2s, transform 1s ease-out 1.2s;
    margin-bottom: 12px;
  }
  
  .wish-body {
    font-family: 'Nunito', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.5;
    text-shadow: 0 2px 5px rgba(0,0,0,0.2), 0 0 10px #FF6EB4;
    opacity: 0;
    transform: translateY(20px);
    /* Lời nhắn sẽ mượt mà hiện ra ngay sau khi tiêu đề hiện xong */
    transition: opacity 1s ease-out 1.5s, transform 1s ease-out 1.5s; 
  }
  
  #page2.visible .wish-title,
  #page2.visible .wish-body {
    opacity: 1;
    transform: translateY(0);
  }

  .love-sign {
    display: inline-block; /* Bắt buộc để hiệu ứng phóng to thu nhỏ hoạt động */
    font-size: 28px; /* Cho to đùng lên (chữ bình thường đang 18px) */
    color: white; /* Có thể dùng màu vàng nắng hoặc #FF6EB4 (Hồng hot) cho nổi */
    text-shadow: 0 0 10px #FF6EB4, 0 0 20px #FF6EB4, 0 0 30px #FF6EB4; /* Phát sáng rực rỡ */
    margin-top: 10px;
    animation: heartBeat 1.5s infinite alternate; /* Hiệu ứng đập thình thịch */
  }

  /* Keyframe nhịp tim đập */
  @keyframes heartBeat {
    0% { transform: scale(1); }
    100% { transform: scale(1.15); } /* Phình to ra 15% */
  }

  /* Đại dương & Sóng */
  .ocean {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 25%;
    z-index: 5;
  }
  .wave-layer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%; 
    height: 100%;
    background-repeat: repeat-x;
    background-position: bottom;
    background-size: 50% 100%;
  }

  .wave-3 {
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 800 100' preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,50 Q100,20 200,50 T400,50 T600,50 T800,50 V100 H0 Z' fill='%23FFB3D9' opacity='0.5'/%3E%3C/svg%3E");
    bottom: 30px;
    animation: waveMove 8s linear infinite;
  }
  .wave-2 {
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 800 100' preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,60 Q100,30 200,60 T400,60 T600,60 T800,60 V100 H0 Z' fill='%23FF8FAB' opacity='0.7'/%3E%3C/svg%3E");
    bottom: 15px;
    animation: waveMove 5s linear infinite reverse; 
  }
  .wave-1 {
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 800 100' preserveAspectRatio='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,70 Q100,40 200,70 T400,70 T600,70 T800,70 V100 H0 Z' fill='%23FF6EB4' opacity='0.95'/%3E%3C/svg%3E");
    bottom: 0;
    animation: waveMove 3s linear infinite;
  }

  @keyframes waveMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); } 
  }
  @keyframes floatCloud {
    0% { transform: translateX(-100px); }
    100% { transform: translateX(100vw); }
  }

</style>
</head>
<body>

  <div id="page1" class="page">
    <canvas id="confetti-canvas"></canvas>

    <div class="card-content">

          <rect x="28" y="118" width="144" height="52" rx="10" fill="#FF8FAB"/>
          <rect x="28" y="118" width="144" height="14" rx="7" fill="#FFB3D9"/>
          <path d="M40 132 Q50 142 60 132 Q70 142 80 132 Q90 142 100 132 Q110 142 120 132 Q130 142 140 132 Q150 142 160 132" fill="none" stroke="#FFD6E7" stroke-width="4" stroke-linecap="round"/>

          <line x1="100" y1="44" x2="100" y2="38" stroke="#2D2D2D" stroke-width="1.5" stroke-linecap="round"/>

            <ellipse cx="100" cy="34" rx="5" ry="7.5" fill="#FFD93D" opacity="0.9"/>

      <div class="hb-title">Happy Birthday!</div>

      <button class="btn-open" id="btn-open" onclick="openGift()">

  </div>

  <div id="flip-layer">
    <div id="flip-card"></div>
  </div>

  <div id="page2" class="page">
    <div class="clouds">
        <svg class="cloud cloud-1" width="120" height="60" viewBox="0 0 120 60" fill="#FFFFFF">
            <circle cx="30" cy="30" r="20"/> <circle cx="60" cy="20" r="25"/> <circle cx="90" cy="35" r="15"/>

<script>
/* ── CONFETTI ── */
(function() {
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  const colors = ['#FF6EB4','#FFB3D9','#FFD93D','#FF8FAB','#c77dff','#ffffff'];
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function makeParticle(burst, x, y) {
    const angle = burst ? Math.random() * Math.PI * 2 : 0;
    const speed = burst ? 4 + Math.random() * 8 : 0;
    return {
      x: burst ? x : Math.random() * W,
      y: burst ? y : -10,
      vx: burst ? Math.cos(angle) * speed : (Math.random() - 0.5) * 1.2,
      vy: burst ? Math.sin(angle) * speed : 1 + Math.random() * 2,
      w: 5 + Math.random() * 6,
      h: 4 + Math.random() * 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 5,
      alpha: 1,
      burst: burst || false,
      gravity: burst ? 0.2 : 0.02,
      drag: burst ? 0.97 : 1
    };
  }

  // Khởi tạo hạt rơi xung quanh
  for (let i = 0; i < 150; i++) {
    const p = makeParticle(false);
    p.y = Math.random() * H; 
    particles.push(p);
  }

  let lastSpawn = 0;
  function loop(ts) {
    ctx.clearRect(0, 0, W, H);
    if (ts - lastSpawn > 50 && particles.filter(p=>!p.burst).length < 150) {
      particles.push(makeParticle(false));
      lastSpawn = ts;
    }
    particles.forEach(p => {
      p.x  += p.vx;
      p.y  += p.vy;
      p.vy += p.gravity;
      p.vx *= p.drag;
      p.vy *= p.drag;
      p.rot += p.rotV;
      if (p.burst) p.alpha -= 0.012;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.alpha);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    particles = particles.filter(p => p.y < H + 20 && p.alpha > 0);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  window.burstConfetti = function(x, y) {
    for (let i = 0; i < 150; i++) particles.push(makeParticle(true, x, y));
  };
})();

/* ── FLIP + OPEN ── */
function openGift() {
  const btn = document.getElementById('btn-open');
  btn.disabled = true;

  // 1. Nổ confetti bùm bùm tại vị trí nút bấm
  const r = btn.getBoundingClientRect();
  window.burstConfetti(r.left + r.width/2, r.top + r.height/2);

  // ==========================================
  // SỬA LỖI LỚP ĐÈ: Đợi 500ms (nửa giây) cho pháo nổ đã rồi mới lật!
  // ==========================================
  setTimeout(() => {
    const page1 = document.getElementById('page1');
    const page2 = document.getElementById('page2');
    const flipLayer = document.getElementById('flip-layer');
    const flipCard  = document.getElementById('flip-card');

    // Bật thẻ lật ảo
    flipLayer.style.pointerEvents = 'none';
    flipCard.style.display = 'block';
    flipCard.style.transformStyle = 'preserve-3d';
    flipCard.style.transform = 'rotateY(0deg)';

    // Đưa nền của Page 2 lên trên
    page2.style.zIndex = '3';
    page2.style.opacity = '1';
    
    // Giấu Page 1
    page1.style.opacity = '0';

    // Bắt đầu lật
    setTimeout(() => {
      flipCard.style.transition = 'transform 1.3s cubic-bezier(0.645, 0.045, 0.355, 1.000)';
      flipCard.style.transform  = 'rotateY(-180deg)';
    }, 50);

    // Lật xong thì dọn dẹp
    setTimeout(() => {
      page1.style.display = 'none'; 
      flipCard.style.display = 'none'; 
      page2.classList.add('visible'); 
    }, 1350);
    
  }, 500); /* 👈 Con số 500 này quyết định việc đứng lại xem pháo nổ trước khi lật */
}
</script>
